name: CI — PubTube Módulo 1

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo branch/PR para optimizar uso de runners
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Calidad de Código y Pruebas Unitarias
  # Corre en 1 solo runner para develop, main y PRs (~30-40s).
  # ──────────────────────────────────────────────────────────────────────────
  quality-and-build:
    name: 📦 Quality & Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js con caché de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🎨 Prettier — Verificar formato
        run: pnpm run format:check

      - name: ⚡ oxlint — Linting estructural (Rust fail-fast)
        run: pnpm run lint

      - name: 🔄 madge — Detectar ciclos entre módulos
        run: pnpm run check:cycles

      - name: 🔷 tsc --noEmit — Verificación de tipos TypeScript
        run: pnpm run typecheck

      - name: 🔬 ESLint — Reglas semánticas con type information
        run: pnpm run lint:types

      - name: 🧪 Vitest — Tests unitarios
        run: pnpm run test

      - name: 🏗️ NestJS — Verificar compilación de producción (build)
        run: pnpm run build

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Tests de Integración Interna (PostgreSQL + Garage en memoria + E2E)
  # Se ejecuta antes de mergear/aceptar hacia main (PRs o push a main).
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: 🧪 Integration Tests (Required for main)
    runs-on: ubuntu-24.04
    needs: quality-and-build
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js con caché de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🧪 Ejecutar suite de integración (PostgreSQL + Garage en memoria + E2E)
        run: pnpm run test:integration

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Integración con Gateway (M4) y Publicación en GHCR
  # Orden: pruebas (needs: quality-and-build) → integración con Gateway → publicación.
  # El push a GHCR ocurre únicamente si todo pasó y el evento fue push a develop.
  # ──────────────────────────────────────────────────────────────────────────
  gateway-integration:
    name: 🌐 Gateway Integration & Publish
    runs-on: ubuntu-latest
    needs: quality-and-build
    env:
      MODULE_SLOT: ${{ vars.MODULE_SLOT || '1' }}
      MODULE_PORT: ${{ vars.MODULE_PORT || '8000' }}
      GATEWAY_SMOKE_PATH: ${{ vars.GATEWAY_SMOKE_PATH || '' }}
      JWT_SECRET: module-ci-only-secret-change-this-value

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Validate module integration settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MODULE_SLOT" =~ ^[123]$ ]]; then
            printf 'MODULE_SLOT must be 1, 2, or 3.\n' >&2
            exit 1
          fi
          if [[ ! "$MODULE_PORT" =~ ^[0-9]+$ ]] || (( MODULE_PORT < 1 || MODULE_PORT > 65535 )); then
            printf 'MODULE_PORT must be between 1 and 65535.\n' >&2
            exit 1
          fi
          smoke_path="$GATEWAY_SMOKE_PATH"
          case "$MODULE_SLOT" in
            1) health_smoke_path=/api/content/health ;;
            2) health_smoke_path=/api/events/health ;;
            3) health_smoke_path=/api/publish/health ;;
          esac
          if [[ -z "$smoke_path" ]]; then
            smoke_path="$health_smoke_path"
          fi
          if [[ ! "$smoke_path" =~ ^/[A-Za-z0-9._~/%-]+$ ]]; then
            printf 'GATEWAY_SMOKE_PATH must be an absolute URL path.\n' >&2
            exit 1
          fi
          printf 'smoke_path=%s\n' "$smoke_path" >> "$GITHUB_OUTPUT"
          printf 'health_smoke_path=%s\n' "$health_smoke_path" >> "$GITHUB_OUTPUT"

      - name: Build module image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag pubtube-module-under-test:ci .

      - name: Pull Gateway image
        run: docker pull ghcr.io/tilininsano312/pubtube-mod4:develop

      - name: Create integration network
        run: docker network create module-gateway-integration

      - name: Start module container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name module-under-test \
            --network module-gateway-integration \
            --network-alias module-under-test \
            --env "PORT=$MODULE_PORT" \
            pubtube-module-under-test:ci

      - name: Start Gateway container
        shell: bash
        run: |
          set -euo pipefail
          gateway_env=(
            --env GATEWAY_PORT=8000
            --env "JWT_SECRET=$JWT_SECRET"
            --env JWT_ALGORITHM=HS256
          )
          gateway_env+=(--env "MODULE${MODULE_SLOT}_URL=http://module-under-test:$MODULE_PORT")

          docker run --detach \
            --name gateway-under-test \
            --network module-gateway-integration \
            --publish 8000:8000 \
            "${gateway_env[@]}" \
            ghcr.io/tilininsano312/pubtube-mod4:develop

      - name: Wait for module and Gateway health
        env:
          GATEWAY_SMOKE_PATH: ${{ steps.settings.outputs.smoke_path }}
          GATEWAY_HEALTH_SMOKE_PATH: ${{ steps.settings.outputs.health_smoke_path }}
        shell: bash
        run: |
          set -euo pipefail
          gateway_ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent \
              http://127.0.0.1:8000/api/health --output /dev/null 2>/dev/null; then
              gateway_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$gateway_ready" != true ]]; then
            printf 'Gateway did not become healthy in time.\n' >&2
            exit 1
          fi

          token="$(docker exec gateway-under-test python -c \
            'import os,time,jwt; print(jwt.encode({"sub":"module-ci","user_id":"module-ci","role":"admin","exp":int(time.time())+300}, os.environ["JWT_SECRET"], algorithm="HS256"))')"
          healthy=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent \
              --header "Authorization: Bearer $token" \
              --header "X-Correlation-Id: module-ci-${GITHUB_RUN_ID}" \
              "http://127.0.0.1:8000$GATEWAY_HEALTH_SMOKE_PATH" --output /dev/null 2>/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            printf 'Module health check did not succeed through the Gateway.\n' >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            --header "X-Correlation-Id: module-ci-${GITHUB_RUN_ID}" \
            "http://127.0.0.1:8000$GATEWAY_SMOKE_PATH" --output /dev/null

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/setup-buildx-action@v3

      - name: Publish module image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:develop"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image" \
            --push .

      - name: Show containers and logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs module-under-test || true
          docker logs gateway-under-test || true

      - name: Clean up integration containers
        if: always()
        run: |
          docker rm --force module-under-test gateway-under-test || true
          docker network rm module-gateway-integration || true
