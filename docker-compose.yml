name: pubtube-modulo1

# Entorno de desarrollo local. Requiere un .env (cp .env.example .env).
# Las variables marcadas con :? son obligatorias: Compose aborta con un mensaje
# claro si faltan, en vez de levantar servicios con credenciales vacías.

services:
  # ─────────────────────────────────────────────
  # API – Módulo 1: Gestión de Contenidos
  # ─────────────────────────────────────────────
  module1-content:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: module1-content
    restart: unless-stopped
    ports:
      - '${API_PORT:-8000}:8000'
    environment:
      PORT: '8000'
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      MINIO_ENDPOINT: garage
      MINIO_PORT: '3900'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT:-videos}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-thumbnails}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage-setup:
        condition: service_completed_successfully
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Migraciones Drizzle (one-shot)
  # Usa la etapa builder, que incluye drizzle-kit y src/db/migrations.
  # ─────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: module1-migrate
    restart: 'no'
    command: ['pnpm', 'exec', 'drizzle-kit', 'migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Base de Datos – PostgreSQL
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: module1-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Almacenamiento de Objetos – Garage (S3-compatible)
  # --single-node: configura layout mono-nodo automáticamente
  # --default-bucket: crea key + bucket de contenido vía env vars
  # Secretos (rpc/admin) por env var, nunca en garage.toml
  # ─────────────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: module1-garage
    restart: unless-stopped
    entrypoint: ['/garage']
    command: ['server', '--single-node', '--default-bucket']
    ports:
      - '${MINIO_API_PORT:-9000}:3900'
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: ${MINIO_BUCKET_CONTENT:-videos}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    healthcheck:
      # Imagen distroless: se usa la propia CLI de Garage vía RPC
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Aprovisionamiento de buckets (one-shot)
  # Imagen Alpine + curl + jq (scripts/garage-setup.Dockerfile), construida
  # una vez: no se instala nada en cada arranque.
  # ─────────────────────────────────────────────
  garage-setup:
    build:
      context: ./scripts
      dockerfile: garage-setup.Dockerfile
    image: pubtube-garage-setup:local
    container_name: module1-garage-setup
    restart: 'no'
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
      GARAGE_S3_URL: http://garage:3900
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      GARAGE_MULTIPART_ABORT_DAYS: ${GARAGE_MULTIPART_ABORT_DAYS:-7}
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT:-videos}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-thumbnails}
    volumes:
      - ./scripts/garage-setup.sh:/garage-setup.sh:ro
    entrypoint: ['/bin/sh', '/garage-setup.sh']
    networks:
      - module1-net

volumes:
  pg_data:
  garage_data:

networks:
  module1-net:
    driver: bridge
