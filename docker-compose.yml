services:
  # ─────────────────────────────────────────────
  # API – Módulo 1: Gestión de Contenidos
  # ─────────────────────────────────────────────
  module1-content:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: module1-content
    restart: unless-stopped
    ports:
      - '${API_PORT:-8000}:8000'
    environment:
      PORT: '8000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: garage
      MINIO_PORT: '3900'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS}
    depends_on:
      db:
        condition: service_healthy
      garage-setup:
        condition: service_completed_successfully
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Base de Datos – PostgreSQL
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: module1-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Almacenamiento de Objetos – Garage (S3-compatible)
  # ─────────────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: module1-garage
    restart: unless-stopped
    ports:
      - '${MINIO_API_PORT:-9000}:3900'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Aprovisionamiento de Garage (Práctica DevOps)
  # ─────────────────────────────────────────────
  garage-setup:
    image: dxflrs/garage:v2.4.1
    container_name: module1-garage-setup
    restart: 'no'
    depends_on:
      garage:
        condition: service_started
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT:-videos}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-thumbnails}
    networks:
      - module1-net
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando a que Garage acepte conexiones...';
      until /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token status 2>/dev/null; do
        sleep 2;
      done;
      NODE_ID=$$(/garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token status | grep 'ALIVE' | awk '{print $$1}');
      /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token layout assign -z dc1 -c 10G $$NODE_ID 2>/dev/null || true;
      /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token layout apply --version 1 2>/dev/null || true;
      /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token key import -n pubtube-key --key-id $${MINIO_ACCESS_KEY} --secret-key $${MINIO_SECRET_KEY} 2>/dev/null || true;
      /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token bucket create $${MINIO_BUCKET_CONTENT} 2>/dev/null || true;
      /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token bucket create $${MINIO_BUCKET_THUMBNAILS} 2>/dev/null || true;
      /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token bucket allow $${MINIO_BUCKET_CONTENT} --key pubtube-key --read --write 2>/dev/null || true;
      /garage admin -a http://garage:3903 --admin-token pubtube-garage-admin-token bucket allow $${MINIO_BUCKET_THUMBNAILS} --key pubtube-key --read --write 2>/dev/null || true;
      echo 'Buckets aprovisionados correctamente.';
      exit 0;
      "

volumes:
  pg_data:
    driver: local
  garage_data:
    driver: local

networks:
  module1-net:
    driver: bridge
