services:
  # ─────────────────────────────────────────────
  # API – Módulo 1: Gestión de Contenidos
  # ─────────────────────────────────────────────
  module1-content:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: module1-content
    restart: unless-stopped
    ports:
      - '${API_PORT:-8000}:8000'
    environment:
      PORT: '8000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS}
    depends_on:
      db:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Base de Datos – PostgreSQL
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: module1-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Almacenamiento de Objetos – MinIO
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: module1-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - module1-net

  # ─────────────────────────────────────────────
  # Aprovisionamiento de MinIO (Práctica DevOps)
  # ─────────────────────────────────────────────
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: module1-minio-setup
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT:-videos}
    networks:
      - module1-net
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY}); do
        echo 'Esperando a que MinIO acepte conexiones...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/$${MINIO_BUCKET_CONTENT} --ignore-existing;
      echo 'Bucket aprovisionado correctamente.';
      exit 0;
      "

volumes:
  pg_data:
    driver: local
  minio_data:
    driver: local

networks:
  module1-net:
    driver: bridge
