services:
  # ─────────────────────────────────────────────
  # Base de Datos de Prueba – PostgreSQL (tmpfs)
  # ─────────────────────────────────────────────
  db-test:
    image: postgres:16-alpine
    container_name: module1-db-test
    restart: 'no'
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-test_pubtube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_pubtube_secret}
      POSTGRES_DB: ${POSTGRES_DB:-test_pubtube_db}
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-test_pubtube} -d ${POSTGRES_DB:-test_pubtube_db}']
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - module1-test-net

  # ─────────────────────────────────────────────
  # Almacenamiento de Objetos de Prueba – Garage (tmpfs)
  # ─────────────────────────────────────────────
  garage-test:
    image: dxflrs/garage:v2.4.1
    container_name: module1-garage-test
    restart: 'no'
    ports:
      - '${MINIO_API_PORT:-9100}:3900'
    volumes:
      - ./garage.test.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage:rw,noexec,nosuid,size=512m
    networks:
      - module1-test-net

  # ─────────────────────────────────────────────
  # Aprovisionamiento de Buckets en Garage de Prueba
  # ─────────────────────────────────────────────
  garage-setup-test:
    image: dxflrs/garage:v2.4.1
    container_name: module1-garage-setup-test
    restart: 'no'
    depends_on:
      garage-test:
        condition: service_started
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-testminioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-testminioadmin}
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT:-videos}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-thumbnails}
    networks:
      - module1-test-net
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando a que Garage de test acepte conexiones...';
      until /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token status 2>/dev/null; do
        sleep 1;
      done;
      NODE_ID=$$(/garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token status | grep 'ALIVE' | awk '{print $$1}');
      /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token layout assign -z dc1 -c 10G $$NODE_ID 2>/dev/null || true;
      /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token layout apply --version 1 2>/dev/null || true;
      /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token key import -n pubtube-test-key --key-id $${MINIO_ACCESS_KEY} --secret-key $${MINIO_SECRET_KEY} 2>/dev/null || true;
      /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token bucket create $${MINIO_BUCKET_CONTENT} 2>/dev/null || true;
      /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token bucket create $${MINIO_BUCKET_THUMBNAILS} 2>/dev/null || true;
      /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token bucket allow $${MINIO_BUCKET_CONTENT} --key pubtube-test-key --read --write 2>/dev/null || true;
      /garage admin -a http://garage-test:3903 --admin-token pubtube-garage-test-admin-token bucket allow $${MINIO_BUCKET_THUMBNAILS} --key pubtube-test-key --read --write 2>/dev/null || true;
      echo 'Buckets de prueba aprovisionados correctamente.';
      exit 0;
      "

networks:
  module1-test-net:
    driver: bridge
